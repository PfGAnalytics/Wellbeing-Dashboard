on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 1 * *"

jobs:
  import-data:
    runs-on: ubuntu-latest
    steps:
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::dplyr
            any::jsonlite
            any::stringr
            any::purrr

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Indicator Summary
        run: Rscript -e 'source("scripts/indicator-performance-table.R")'

      - name: Commit results
        run: |
          git config --local user.email " "
          git config --local user.name "PfGAnalytics"
          git add backup
          git add 'backup/indicator-performance-summary.RDS'
          git add 'indicator-performance-table.xlsx'
          git commit -m 'Data updated' || echo "No changes to commit"
          git push origin || echo "No changes to commit"